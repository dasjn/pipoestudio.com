name: Deploy Sanity Studio

on:
  push:
    branches: [main]
    paths:
      - 'studio/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install studio dependencies
        working-directory: studio
        run: npm install --legacy-peer-deps

      - name: Install esbuild at workspace root
        run: npm install --no-save --legacy-peer-deps esbuild

      - name: Deploy
        working-directory: studio
        run: npx sanity deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_PROJECT_ID: kzek939n
          SANITY_STUDIO_DATASET: production
          SANITY_STUDIO_PREVIEW_URL: https://pipoestudiowebfrontend.vercel.app
