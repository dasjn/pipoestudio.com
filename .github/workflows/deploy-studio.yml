name: Deploy Sanity Studio

on:
  push:
    branches: [main]
    paths:
      - 'studio/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci --workspace=studio

      - run: npm run deploy --workspace=studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_PREVIEW_URL: https://pipoestudiowebfrontend.vercel.app
